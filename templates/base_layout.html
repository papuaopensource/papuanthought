<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    {% include "partials/head.html" %}
    <title>{% block title %}Papuan Thought{% endblock %}</title>
    <meta name="description"
          content="{% block description %}An open-source platform for essays, reflections, and community writing from Papuans.{% endblock %}" />
    {% block extra_head %}{% endblock %}
  </head>
  {# Bare layout for the public sign-in / sign-up pages: no navbar, no footer. #}
  <body data-auth="{{ user.is_authenticated|yesno:'true,false' }}"
        data-login-url="{% url 'accounts:login' %}"
        class="flex min-h-screen items-center justify-center">
    <main class="{% block container %}w-full max-w-sm px-4 py-12{% endblock %}">
      {% block content %}{% endblock %}
    </main>
    {% include "partials/toast.html" %}
  </body>
</html>
